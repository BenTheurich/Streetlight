<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Streetlight sharing image source</title>
    <!-- Render at 1200 × 630, deviceScaleFactor 1, JPEG quality 92 to public/streetlight-share-v1.jpg. -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body { background: #030914; color: #f6f1e5; }
      main { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .light {
        position: absolute;
        width: 740px;
        height: 740px;
        top: -175px;
        left: 620px;
        background: radial-gradient(ellipse, rgb(231 173 80 / 18%), rgb(231 173 80 / 5%) 34%, transparent 67%);
      }
      .lamp { position: absolute; width: 610px; height: 915px; left: 728px; top: -42px; }
      /* Keep the words inside the central 630px square for clients that crop wide previews. */
      .brand { position: absolute; left: 50%; top: 76px; transform: translateX(-50%); display: flex; align-items: center; gap: 19px; }
      .brand img { width: 25px; height: 44px; }
      h1 { position: absolute; left: 50%; top: 232px; transform: translateX(-50%); width: max-content; margin: 0; font: 400 88px/1.04 Georgia, serif; letter-spacing: -2.4px; text-align: center; }
      h1 span { display: block; }
      h1 .streets { color: #e7ad50; }
      .brand span { font: 700 28px 'Trebuchet MS', Arial, sans-serif; letter-spacing: 3.5px; }
      p { position: absolute; left: 50%; top: 491px; transform: translateX(-50%); width: max-content; margin: 0; color: #d8cfbf; font: 400 25px/1.4 'Trebuchet MS', Arial, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <div class="light"></div>
      <img class="lamp" src="../public/landing/streetlamp-v2.webp" alt="">
      <div class="brand">
        <img src="../public/landing/streetlight-logo-white-v2.webp" alt="">
        <span>STREETLIGHT</span>
      </div>
      <h1><span>Carry the light</span><span class="streets">to every street.</span></h1>
      <p>Outreach planning for churches.</p>
    </main>
  </body>
</html>
